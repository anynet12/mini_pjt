<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="IRP 연금 수령 신청, 돈 필요 없어도 1만 원부터 해야 하는 이유">
  <rect x="0" y="0" width="1600" height="900" fill="#F5F3EE"/>
  <rect x="0" y="0" width="28" height="900" fill="#2B3A55"/>
  <circle cx="1310" cy="430" r="330" fill="#E6E2DA"/>

  <text x="110" y="200" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="44" font-weight="600" fill="#3A8F7B">돈 필요 없어도</text>
  <text x="110" y="310" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="88" font-weight="800" fill="#2B3A55">IRP 연금 수령 신청,</text>
  <text x="110" y="420" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="88" font-weight="800" fill="#2B3A55">1만 원부터 하는 이유</text>

  <rect x="110" y="470" width="120" height="8" rx="4" fill="#D98C3F"/>
  <text x="110" y="550" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="40" font-weight="500" fill="#4B5563">퇴직소득세 감면 연차는</text>
  <text x="110" y="605" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="40" font-weight="500" fill="#4B5563">신청해야 돌아가요</text>

  <rect x="110" y="690" width="300" height="64" rx="32" fill="#2B3A55"/>
  <text x="260" y="733" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="30" font-weight="600" fill="#F5F3EE">30% → 40% 감면</text>
  <rect x="430" y="690" width="260" height="64" rx="32" fill="#FFFFFF" stroke="#2B3A55" stroke-width="4"/>
  <text x="560" y="733" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="30" font-weight="600" fill="#2B3A55">수령 연차 2개</text>

  <circle cx="1240" cy="400" r="190" fill="#D98C3F"/>
  <circle cx="1240" cy="400" r="190" fill="none" stroke="#2B3A55" stroke-width="8"/>
  <circle cx="1240" cy="400" r="150" fill="none" stroke="#F5F3EE" stroke-width="6" stroke-dasharray="16 14"/>
  <text x="1240" y="380" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="120" font-weight="800" fill="#FFFFFF">1만</text>
  <text x="1240" y="455" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="46" font-weight="600" fill="#FFFFFF">원 / 년</text>

  <rect x="1020" y="600" width="480" height="150" rx="24" fill="#FFFFFF" stroke="#2B3A55" stroke-width="5"/>
  <text x="1060" y="655" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="30" font-weight="500" fill="#6B7280">퇴직소득세 감면용 수령 연차</text>
  <text x="1060" y="720" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="48" font-weight="800" fill="#3A8F7B">1년 차 시작</text>
  <polygon points="1400,690 1400,730 1440,710" fill="#3A8F7B"/>
</svg>
