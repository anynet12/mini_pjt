<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="IRP 퇴직소득세 감면 구간 타임라인 — 수령 연차 1~10년 차 30%, 11년 차부터 40%">
  <rect x="0" y="0" width="1200" height="800" fill="#F5F3EE"/>

  <text x="600" y="90" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="40" font-weight="800" fill="#2B3A55">퇴직소득세 감면, 수령 연차로 갈려요</text>
  <text x="600" y="140" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="500" fill="#6B7280">감면용 연차는 연금 수령을 신청한 시점부터 세요</text>

  <rect x="120" y="380" width="640" height="80" rx="14" fill="#D98C3F"/>
  <path d="M 760 380 L 1040 380 L 1090 420 L 1040 460 L 760 460 Z" fill="#3A8F7B"/>

  <text x="440" y="300" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="30" font-weight="600" fill="#4B5563">1년 차 ~ 10년 차</text>
  <text x="440" y="360" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="56" font-weight="800" fill="#D98C3F">30% 감면</text>

  <text x="920" y="300" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="30" font-weight="600" fill="#4B5563">11년 차부터</text>
  <text x="920" y="360" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="56" font-weight="800" fill="#3A8F7B">40% 감면</text>

  <line x1="120" y1="470" x2="120" y2="490" stroke="#2B3A55" stroke-width="3"/>
  <line x1="184" y1="470" x2="184" y2="490" stroke="#2B3A55" stroke-width="3"/>
  <line x1="248" y1="470" x2="248" y2="490" stroke="#2B3A55" stroke-width="3"/>
  <line x1="312" y1="470" x2="312" y2="490" stroke="#2B3A55" stroke-width="3"/>
  <line x1="376" y1="470" x2="376" y2="490" stroke="#2B3A55" stroke-width="3"/>
  <line x1="440" y1="470" x2="440" y2="490" stroke="#2B3A55" stroke-width="3"/>
  <line x1="504" y1="470" x2="504" y2="490" stroke="#2B3A55" stroke-width="3"/>
  <line x1="568" y1="470" x2="568" y2="490" stroke="#2B3A55" stroke-width="3"/>
  <line x1="632" y1="470" x2="632" y2="490" stroke="#2B3A55" stroke-width="3"/>
  <line x1="696" y1="470" x2="696" y2="490" stroke="#2B3A55" stroke-width="3"/>
  <line x1="760" y1="470" x2="760" y2="500" stroke="#2B3A55" stroke-width="5"/>

  <text x="152" y="525" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#2B3A55">1</text>
  <text x="216" y="525" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#2B3A55">2</text>
  <text x="280" y="525" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#2B3A55">3</text>
  <text x="344" y="525" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#2B3A55">4</text>
  <text x="408" y="525" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#2B3A55">5</text>
  <text x="472" y="525" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#2B3A55">6</text>
  <text x="536" y="525" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#2B3A55">7</text>
  <text x="600" y="525" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#2B3A55">8</text>
  <text x="664" y="525" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#2B3A55">9</text>
  <text x="728" y="525" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#2B3A55">10</text>
  <text x="800" y="525" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="800" fill="#3A8F7B">11</text>
  <text x="940" y="525" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="600" fill="#6B7280">(년 차)</text>

  <circle cx="120" cy="420" r="26" fill="#2B3A55" stroke="#F5F3EE" stroke-width="5"/>
  <polygon points="111,406 111,434 133,420" fill="#FFFFFF"/>
  <line x1="120" y1="560" x2="120" y2="620" stroke="#2B3A55" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="60" y="620" width="400" height="110" rx="18" fill="#FFFFFF" stroke="#2B3A55" stroke-width="4"/>
  <text x="260" y="665" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="28" font-weight="800" fill="#2B3A55">연금 수령 신청</text>
  <text x="260" y="705" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="500" fill="#6B7280">= 감면용 연차 1년 차 시작</text>

  <line x1="760" y1="560" x2="760" y2="620" stroke="#3A8F7B" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="580" y="620" width="400" height="110" rx="18" fill="#FFFFFF" stroke="#3A8F7B" stroke-width="4"/>
  <text x="780" y="665" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="28" font-weight="800" fill="#3A8F7B">갈림길 11년 차</text>
  <text x="780" y="705" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="500" fill="#6B7280">감면율 10%p 차이</text>
</svg>
