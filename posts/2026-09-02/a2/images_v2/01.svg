<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="퇴직금이 입금된 IRP 계좌 화면과 연금 수령 신청 버튼 일러스트">
  <rect x="0" y="0" width="1200" height="800" fill="#F5F3EE"/>

  <rect x="270" y="50" width="520" height="700" rx="40" fill="#2B3A55"/>
  <rect x="290" y="70" width="480" height="660" rx="28" fill="#FFFFFF"/>
  <rect x="470" y="86" width="120" height="14" rx="7" fill="#E6E2DA"/>

  <text x="330" y="160" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="34" font-weight="700" fill="#2B3A55">IRP 계좌</text>
  <rect x="330" y="180" width="60" height="6" rx="3" fill="#3A8F7B"/>

  <rect x="330" y="220" width="400" height="200" rx="20" fill="#F5F3EE" stroke="#E6E2DA" stroke-width="3"/>
  <circle cx="370" cy="270" r="16" fill="#3A8F7B"/>
  <polyline points="361,270 368,277 380,263" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="280" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="28" font-weight="500" fill="#4B5563">퇴직금 입금 완료</text>
  <text x="360" y="355" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="30" font-weight="500" fill="#6B7280">잔고</text>
  <text x="700" y="360" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="52" font-weight="800" fill="#2B3A55">약 1.2억 원</text>

  <rect x="330" y="450" width="400" height="60" rx="14" fill="#FFFFFF" stroke="#E6E2DA" stroke-width="3"/>
  <text x="350" y="490" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="500" fill="#9AA3B2">상품 운용 — 나중에 결정</text>

  <rect x="330" y="540" width="400" height="90" rx="20" fill="#3A8F7B"/>
  <text x="530" y="597" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">연금 수령 신청</text>

  <polygon points="660,600 660,660 676,646 692,676 706,668 690,640 712,638" fill="#2B3A55" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>

  <path d="M 860 300 L 1130 300 Q 1150 300 1150 320 L 1150 440 Q 1150 460 1130 460 L 900 460 L 860 500 L 860 460 Q 840 460 840 440 L 840 320 Q 840 300 860 300 Z" fill="#FFFFFF" stroke="#D98C3F" stroke-width="5"/>
  <text x="995" y="355" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="28" font-weight="500" fill="#4B5563">당장 쓸 돈 아니어도</text>
  <text x="995" y="415" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="36" font-weight="800" fill="#D98C3F">연 1만 원만 받기</text>

  <rect x="60" y="560" width="190" height="180" rx="20" fill="#FFFFFF" stroke="#2B3A55" stroke-width="4"/>
  <text x="155" y="615" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="500" fill="#6B7280">감면용 연차</text>
  <text x="155" y="690" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="44" font-weight="800" fill="#3A8F7B">1년 차</text>
</svg>
