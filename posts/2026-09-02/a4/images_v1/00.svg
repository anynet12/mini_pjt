<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="퇴직금 운용, 억대 목돈은 적립식과 다르다 — 채권 사고 1~2년 기다리자는 말과 운용 5단계 썸네일">
  <rect x="0" y="0" width="1600" height="900" fill="#F5F3EE"/>
  <rect x="0" y="0" width="1600" height="14" fill="#2B4C7E"/>

  <!-- 상단 라벨 -->
  <rect x="90" y="90" width="330" height="54" rx="27" fill="#2B4C7E"/>
  <text x="255" y="127" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">퇴직금 · IRP 목돈 운용</text>

  <!-- 제목 -->
  <text x="90" y="290" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="82" font-weight="800" fill="#2A2F3A">퇴직금 운용,</text>
  <text x="90" y="395" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="82" font-weight="800" fill="#2A2F3A">억대 목돈은</text>
  <text x="90" y="500" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="82" font-weight="800" fill="#2B4C7E">적립식과 다르다</text>

  <!-- 부제 -->
  <line x1="90" y1="560" x2="220" y2="560" stroke="#D99A3E" stroke-width="6" stroke-linecap="round"/>
  <text x="90" y="630" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="38" font-weight="500" fill="#4A5060">"채권 사고 1~2년 기다리자"는 말이 나온 이유</text>
  <text x="90" y="690" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="38" font-weight="500" fill="#4A5060">운용 5단계와 비중 나누는 법</text>

  <!-- 오른쪽 계단 그래픽 -->
  <g>
    <rect x="1010" y="640" width="110" height="120" rx="14" fill="#3A8F7A"/>
    <rect x="1130" y="560" width="110" height="200" rx="14" fill="#3A8F7A" fill-opacity="0.85"/>
    <rect x="1250" y="480" width="110" height="280" rx="14" fill="#2B4C7E" fill-opacity="0.8"/>
    <rect x="1370" y="400" width="110" height="360" rx="14" fill="#2B4C7E" fill-opacity="0.9"/>
    <rect x="1490" y="320" width="50" height="440" rx="14" fill="#2B4C7E"/>
    <!-- 계단 위 화살표 -->
    <path d="M1030 590 L1480 250" stroke="#D99A3E" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M1440 240 L1490 242 L1470 292 Z" fill="#D99A3E"/>
    <!-- 동전 더미 -->
    <ellipse cx="1130" cy="810" rx="150" ry="22" fill="#D99A3E" fill-opacity="0.25"/>
    <rect x="1030" y="770" width="120" height="24" rx="12" fill="#D99A3E"/>
    <rect x="1050" y="742" width="120" height="24" rx="12" fill="#E4B15D"/>
    <rect x="1035" y="714" width="120" height="24" rx="12" fill="#D99A3E"/>
  </g>
</svg>
