<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="1.2억 × 4% = 연 480만 원 → 월 20만 원 → 2주 10만 원으로 쪼개는 현금 방치 비용 계산 도식">
  <rect x="0" y="0" width="1200" height="800" fill="#F5F3EE"/>

  <!-- 제목 -->
  <text x="600" y="80" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="40" font-weight="800" fill="#2A2F3A">현금으로 두면 2주에 10만 원이 샌다</text>
  <text x="600" y="130" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" fill="#5A6070">채권으로만 굴려도 연 4%가 나온다는 전제로 쪼개 본 계산</text>

  <!-- 카드 1: 1.2억 × 4% -->
  <rect x="60" y="300" width="240" height="200" rx="20" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="5"/>
  <text x="180" y="360" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="700" fill="#5A6070">원금 × 채권 금리</text>
  <text x="180" y="430" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="46" font-weight="800" fill="#2B4C7E">1.2억 × 4%</text>

  <!-- 화살표 1 (=) -->
  <line x1="310" y1="400" x2="360" y2="400" stroke="#8A8F98" stroke-width="6" stroke-linecap="round"/>
  <path d="M355 385 L380 400 L355 415 Z" fill="#8A8F98"/>

  <!-- 카드 2: 연 480만 원 -->
  <rect x="390" y="300" width="240" height="200" rx="20" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="5"/>
  <text x="510" y="360" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="700" fill="#5A6070">1년</text>
  <text x="510" y="430" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="46" font-weight="800" fill="#2B4C7E">연 480만 원</text>

  <!-- 화살표 2 (÷12개월) -->
  <text x="675" y="365" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#3A8F7A">÷ 12개월</text>
  <line x1="640" y1="400" x2="690" y2="400" stroke="#8A8F98" stroke-width="6" stroke-linecap="round"/>
  <path d="M685 385 L710 400 L685 415 Z" fill="#8A8F98"/>

  <!-- 카드 3: 월 20만 원 -->
  <rect x="720" y="300" width="200" height="200" rx="20" fill="#FFFFFF" stroke="#2B4C7E" stroke-width="5"/>
  <text x="820" y="360" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" font-weight="700" fill="#5A6070">1개월</text>
  <text x="820" y="430" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="44" font-weight="800" fill="#2B4C7E">월 20만 원</text>

  <!-- 화살표 3 (÷2) -->
  <text x="965" y="365" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#3A8F7A">÷ 2</text>
  <line x1="930" y1="400" x2="980" y2="400" stroke="#8A8F98" stroke-width="6" stroke-linecap="round"/>
  <path d="M975 385 L1000 400 L975 415 Z" fill="#8A8F98"/>

  <!-- 카드 4: 2주 10만 원 (강조) -->
  <rect x="1010" y="280" width="150" height="240" rx="20" fill="#D99A3E"/>
  <text x="1085" y="340" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">2주</text>
  <text x="1085" y="420" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">10만 원</text>
  <text x="1085" y="480" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">이미 사라짐</text>

  <!-- 하단 메시지 -->
  <rect x="150" y="590" width="900" height="120" rx="20" fill="#FFFFFF" stroke="#8A8F98" stroke-width="3"/>
  <text x="600" y="640" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="30" font-weight="700" fill="#2A2F3A">"원금은 그대로 있잖아"가 아니라</text>
  <text x="600" y="688" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="30" font-weight="800" fill="#D99A3E">"오늘 저녁은 10만 원 굶었다"고 생각하는 습관</text>

  <text x="600" y="765" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="22" fill="#8A8F98">IRP 안의 현금은 현금성 자산이라 CMA 금리 정도는 붙지만, 목돈은 함부로 놀리지 않는다</text>
</svg>
