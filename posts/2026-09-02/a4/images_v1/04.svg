<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="준비 정도에 따른 비중 배분 비교 — 금리형 50·나머지 10씩 vs 다섯 가지 20씩 균등 막대 도식">
  <defs>
    <clipPath id="bar1clip"><rect x="100" y="240" width="1000" height="110" rx="16"/></clipPath>
    <clipPath id="bar2clip"><rect x="100" y="470" width="1000" height="110" rx="16"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#F5F3EE"/>

  <!-- 제목 -->
  <text x="600" y="72" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="40" font-weight="800" fill="#2A2F3A">비중은 상품이 아니라 '준비 정도'가 정한다</text>
  <text x="600" y="118" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" fill="#5A6070">다섯 가지를 섞을 때, 앞쪽으로 몰수록 보수적으로 바뀐다</text>

  <!-- 막대 1: 준비 덜 됨 (50 / 10 / 10 / 10 / 10, 비율대로 폭 배분) -->
  <text x="100" y="215" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="30" font-weight="800" fill="#3A8F7A">준비가 덜 됐다면</text>
  <text x="1100" y="215" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" fill="#5A6070">앞쪽(금리형)에 비중을 몬다 → 보수적</text>

  <g clip-path="url(#bar1clip)">
    <rect x="100" y="240" width="556" height="110" fill="#3A8F7A"/>
    <rect x="656" y="240" width="111" height="110" fill="#3A8F7A" fill-opacity="0.65"/>
    <rect x="767" y="240" width="111" height="110" fill="#2B4C7E" fill-opacity="0.7"/>
    <rect x="878" y="240" width="111" height="110" fill="#D99A3E"/>
    <rect x="989" y="240" width="111" height="110" fill="#2B4C7E"/>
  </g>
  <g stroke="#F5F3EE" stroke-width="4">
    <line x1="656" y1="240" x2="656" y2="350"/>
    <line x1="767" y1="240" x2="767" y2="350"/>
    <line x1="878" y1="240" x2="878" y2="350"/>
    <line x1="989" y1="240" x2="989" y2="350"/>
  </g>
  <text x="378" y="311" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="46" font-weight="800" fill="#FFFFFF">50</text>
  <text x="711" y="308" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">10</text>
  <text x="822" y="308" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">10</text>
  <text x="933" y="308" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">10</text>
  <text x="1044" y="308" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF">10</text>

  <!-- 막대 2: 경험자 (20씩 균등) -->
  <text x="100" y="445" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="30" font-weight="800" fill="#2B4C7E">투자 경험이 많고 적극적이라면</text>
  <text x="1100" y="445" text-anchor="end" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" fill="#5A6070">다섯 가지를 균등하게</text>

  <g clip-path="url(#bar2clip)">
    <rect x="100" y="470" width="200" height="110" fill="#3A8F7A"/>
    <rect x="300" y="470" width="200" height="110" fill="#3A8F7A" fill-opacity="0.65"/>
    <rect x="500" y="470" width="200" height="110" fill="#2B4C7E" fill-opacity="0.7"/>
    <rect x="700" y="470" width="200" height="110" fill="#D99A3E"/>
    <rect x="900" y="470" width="200" height="110" fill="#2B4C7E"/>
  </g>
  <g stroke="#F5F3EE" stroke-width="4">
    <line x1="300" y1="470" x2="300" y2="580"/>
    <line x1="500" y1="470" x2="500" y2="580"/>
    <line x1="700" y1="470" x2="700" y2="580"/>
    <line x1="900" y1="470" x2="900" y2="580"/>
  </g>
  <text x="200" y="540" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">20</text>
  <text x="400" y="540" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">20</text>
  <text x="600" y="540" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">20</text>
  <text x="800" y="540" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">20</text>
  <text x="1000" y="540" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">20</text>

  <!-- 범례 -->
  <rect x="100" y="640" width="1000" height="80" rx="16" fill="#FFFFFF" stroke="#8A8F98" stroke-width="3"/>

  <rect x="130" y="666" width="28" height="28" rx="6" fill="#3A8F7A"/>
  <text x="170" y="689" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#2A2F3A">금리형 상품</text>

  <rect x="330" y="666" width="28" height="28" rx="6" fill="#3A8F7A" fill-opacity="0.65"/>
  <text x="370" y="689" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#2A2F3A">TDF</text>

  <rect x="470" y="666" width="28" height="28" rx="6" fill="#2B4C7E" fill-opacity="0.7"/>
  <text x="510" y="689" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#2A2F3A">자산배분 ETF</text>

  <rect x="700" y="666" width="28" height="28" rx="6" fill="#D99A3E"/>
  <text x="740" y="689" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#2A2F3A">배당주</text>

  <rect x="880" y="666" width="28" height="28" rx="6" fill="#2B4C7E"/>
  <text x="920" y="689" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#2A2F3A">주식</text>

  <text x="600" y="772" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" fill="#5A6070">어느 쪽이 정답이라기보다, 여기서 "운용의 묘"를 선택한다</text>
</svg>
