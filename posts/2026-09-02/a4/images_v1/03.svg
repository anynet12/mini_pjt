<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="퇴직금 운용 5단계 사다리 — 금리형 상품, TDF, 자산배분 ETF 포트, 배당주, 주식 순으로 위험이 커지는 계단 도식">
  <rect x="0" y="0" width="1200" height="800" fill="#F5F3EE"/>

  <!-- 제목 -->
  <text x="600" y="72" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="40" font-weight="800" fill="#2A2F3A">퇴직금 운용 5단계 사다리</text>
  <text x="600" y="118" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="26" fill="#5A6070">순서가 곧 위험 순서 — 앞일수록 보수적, 뒤로 갈수록 위험이 커진다</text>

  <!-- 계단 (5칸) -->
  <!-- 1 금리형 상품 -->
  <rect x="60" y="560" width="190" height="110" rx="16" fill="#3A8F7A"/>
  <text x="155" y="605" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">1단계</text>
  <text x="155" y="645" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">금리형 상품</text>
  <text x="155" y="705" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="22" fill="#4A5060">얼마 벌지 미리 정해짐</text>

  <!-- 2 TDF -->
  <rect x="270" y="470" width="190" height="200" rx="16" fill="#3A8F7A" fill-opacity="0.85"/>
  <text x="365" y="515" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">2단계</text>
  <text x="365" y="555" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">TDF</text>
  <text x="365" y="705" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="22" fill="#4A5060">과분산 · 보수적</text>

  <!-- 3 자산배분 ETF 포트 -->
  <rect x="480" y="380" width="190" height="290" rx="16" fill="#2B4C7E" fill-opacity="0.75"/>
  <text x="575" y="425" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">3단계</text>
  <text x="575" y="465" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">자산배분</text>
  <text x="575" y="500" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">ETF 포트</text>
  <text x="575" y="705" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="22" fill="#4A5060">직접 자산배분 구성</text>

  <!-- 4 배당주 -->
  <rect x="690" y="290" width="190" height="380" rx="16" fill="#2B4C7E" fill-opacity="0.88"/>
  <text x="785" y="335" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">4단계</text>
  <text x="785" y="375" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">배당주</text>
  <text x="785" y="705" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="22" fill="#4A5060">자산배분보다 공격적</text>

  <!-- 5 주식 -->
  <rect x="900" y="200" width="190" height="470" rx="16" fill="#2B4C7E"/>
  <text x="995" y="245" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">5단계</text>
  <text x="995" y="285" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">주식</text>
  <text x="995" y="705" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="22" fill="#4A5060">개인 상품의 거의 끝단</text>

  <!-- 상승 화살표 (계단 위) -->
  <path d="M120 520 L960 150" stroke="#D99A3E" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M935 130 L985 140 L960 185 Z" fill="#D99A3E"/>
  <text x="560" y="300" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="28" font-weight="800" fill="#D99A3E" transform="rotate(-23.8 560 300)">위험 · 기대수익 증가</text>

  <!-- 좌우 라벨 -->
  <rect x="60" y="180" width="140" height="48" rx="24" fill="#3A8F7A"/>
  <text x="130" y="213" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">보수적</text>
  <rect x="1000" y="140" width="140" height="48" rx="24" fill="#2B4C7E"/>
  <text x="1070" y="173" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">공격적</text>

  <!-- 바닥선 + 문구 -->
  <line x1="60" y1="740" x2="1140" y2="740" stroke="#8A8F98" stroke-width="3"/>
  <text x="600" y="778" text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="24" fill="#5A6070">이 순서대로 하나씩 고려해 본다 — 앞쪽에서 시작해도 괜찮다</text>
</svg>
