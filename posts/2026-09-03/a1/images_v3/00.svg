<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F6F4EF"/>
  <rect x="0" y="0" width="1600" height="14" fill="#263646"/>

  <rect x="80" y="70" width="290" height="54" rx="27" fill="#5B84A5" opacity="0.15"/>
  <text x="225" y="105" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" font-size="26" font-weight="700" fill="#263646" text-anchor="middle">AI 에이전트 관리</text>

  <text x="800" y="235" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" font-size="62" font-weight="800" fill="#263646" text-anchor="middle">AI 에이전트, 담당자 퇴사하자</text>
  <text x="800" y="315" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" font-size="62" font-weight="800" fill="#263646" text-anchor="middle">하루 만에 사라진 이유</text>

  <rect x="720" y="345" width="160" height="6" rx="3" fill="#DB8A3E"/>

  <!-- panel 1: 1년간 만든 에이전트 -->
  <rect x="170" y="430" width="380" height="390" rx="24" fill="#FFFFFF" stroke="#5B84A5" stroke-width="3"/>
  <line x1="360" y1="460" x2="360" y2="480" stroke="#5B84A5" stroke-width="6"/>
  <circle cx="360" cy="452" r="8" fill="#DB8A3E"/>
  <rect x="310" y="480" width="100" height="90" rx="18" fill="#5B84A5"/>
  <rect x="333" y="508" width="16" height="16" rx="4" fill="#F6F4EF"/>
  <rect x="381" y="508" width="16" height="16" rx="4" fill="#F6F4EF"/>
  <rect x="340" y="545" width="40" height="10" rx="5" fill="#F6F4EF"/>
  <rect x="320" y="575" width="80" height="55" rx="14" fill="#5B84A5" opacity="0.85"/>
  <circle cx="430" cy="600" r="26" fill="#FFFFFF" stroke="#5B84A5" stroke-width="3"/>
  <path d="M418,600 L426,610 L444,586" fill="none" stroke="#5B84A5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360" y="770" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" font-size="28" font-weight="700" fill="#263646" text-anchor="middle">1년간 만든 에이전트</text>

  <path d="M565,600 L598,625 L565,650" fill="none" stroke="#DB8A3E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- panel 2: 담당자 퇴사 -->
  <rect x="610" y="430" width="380" height="390" rx="24" fill="#FFFFFF" stroke="#5B84A5" stroke-width="3"/>
  <circle cx="770" cy="520" r="30" fill="#263646"/>
  <rect x="740" y="555" width="60" height="70" rx="20" fill="#263646"/>
  <line x1="690" y1="540" x2="720" y2="530" stroke="#C7CDD3" stroke-width="5" stroke-linecap="round"/>
  <line x1="685" y1="565" x2="718" y2="558" stroke="#C7CDD3" stroke-width="5" stroke-linecap="round"/>
  <line x1="690" y1="590" x2="720" y2="585" stroke="#C7CDD3" stroke-width="5" stroke-linecap="round"/>
  <text x="800" y="770" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" font-size="28" font-weight="700" fill="#263646" text-anchor="middle">담당자 퇴사</text>

  <path d="M1005,600 L1038,625 L1005,650" fill="none" stroke="#DB8A3E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- panel 3: 하루 만에 제자리로 -->
  <rect x="1050" y="430" width="380" height="390" rx="24" fill="#FFFFFF" stroke="#DB8A3E" stroke-width="3"/>
  <rect x="1170" y="480" width="140" height="110" rx="10" fill="#FFFFFF" stroke="#DB8A3E" stroke-width="4"/>
  <rect x="1170" y="480" width="140" height="24" rx="10" fill="#DB8A3E" opacity="0.85"/>
  <line x1="1205" y1="504" x2="1205" y2="590" stroke="#DB8A3E" stroke-width="2"/>
  <line x1="1240" y1="504" x2="1240" y2="590" stroke="#DB8A3E" stroke-width="2"/>
  <line x1="1275" y1="504" x2="1275" y2="590" stroke="#DB8A3E" stroke-width="2"/>
  <line x1="1170" y1="530" x2="1310" y2="530" stroke="#DB8A3E" stroke-width="2"/>
  <line x1="1170" y1="558" x2="1310" y2="558" stroke="#DB8A3E" stroke-width="2"/>
  <text x="1240" y="770" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" font-size="28" font-weight="700" fill="#263646" text-anchor="middle">하루 만에 제자리로</text>

  <text x="800" y="865" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" font-size="24" fill="#263646" opacity="0.85" text-anchor="middle">오너십과 문서화 없인 1년의 노력도 하루 만에 사라져요</text>
</svg>
