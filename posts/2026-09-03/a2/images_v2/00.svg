  <path d="M 915 622 L 926 633 L 945 609" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="975" y="629" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" font-size="34" font-weight="600" fill="#22303C">책임자</text>

  <!-- row 7 -->
  <rect x="905" y="680" width="50" height="50" rx="10" fill="#2E7D74"/>
  <path d="M 915 707 L 926 718 L 945 694" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="975" y="714" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" font-size="34" font-weight="600" fill="#22303C">예외 조건</text>
