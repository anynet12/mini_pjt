  <!-- row 4 -->
  <rect x="905" y="425" width="50" height="50" rx="10" fill="#2E7D74"/>
  <path d="M 915 452 L 926 463 L 945 439" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="975" y="459" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" font-size="34" font-weight="600" fill="#22303C">사용 가능한 툴</text>

  <!-- row 5 -->
  <rect x="905" y="510" width="50" height="50" rx="10" fill="#2E7D74"/>
  <path d="M 915 537 L 926 548 L 945 524" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="975" y="544" font-family="system-ui, -apple-system, 'Malgun Gothic', sans-serif" font-size="34" font-weight="600" fill="#22303C">출력</text>

  <!-- row 6 -->
