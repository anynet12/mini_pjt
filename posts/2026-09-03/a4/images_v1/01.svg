<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <style>
      .lbl { font-family: system-ui, -apple-system, 'Malgun Gothic', sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#F5F3EE"/>

  <!-- title -->
  <text x="600" y="72" text-anchor="middle" class="lbl" font-size="38" font-weight="700" fill="#24424B">레벨 1 → 5, 계단식 성장 전략</text>

  <!-- caption -->
  <text x="600" y="160" text-anchor="middle" class="lbl" font-size="20" fill="#5B6B6E">스킬을 하나씩 얹어 확장</text>

  <!-- ascending dashed arrow -->
  <path d="M 110 630 L 1080 210" stroke="#D98A3D" stroke-width="3.5" stroke-dasharray="9 9" fill="none"/>
  <path d="M 1080 210 L 1052 204 L 1072 234 Z" fill="#D98A3D"/>

  <!-- baseline -->
  <line x1="60" y1="680" x2="1140" y2="680" stroke="#C9C2AF" stroke-width="2"/>

  <!-- step 1 -->
  <rect x="80" y="580" width="160" height="100" rx="12" fill="#2F6E77" opacity="0.55"/>
  <circle cx="160" cy="546" r="26" fill="#2F6E77"/>
  <text x="160" y="554" text-anchor="middle" class="lbl" font-size="22" font-weight="700" fill="#F5F3EE">1</text>
  <text x="160" y="510" text-anchor="middle" class="lbl" font-size="19" font-weight="700" fill="#24424B">답변형</text>
  <text x="160" y="712" text-anchor="middle" class="lbl" font-size="17" fill="#5B6B6E">질문에 답하고</text>
  <text x="160" y="736" text-anchor="middle" class="lbl" font-size="17" fill="#5B6B6E">추천</text>

  <!-- step 2 -->
  <rect x="300" y="500" width="160" height="180" rx="12" fill="#2F6E77" opacity="0.68"/>
  <circle cx="380" cy="466" r="26" fill="#2F6E77"/>
  <text x="380" y="474" text-anchor="middle" class="lbl" font-size="22" font-weight="700" fill="#F5F3EE">2</text>
  <text x="380" y="430" text-anchor="middle" class="lbl" font-size="19" font-weight="700" fill="#24424B">문서초안형</text>
  <text x="380" y="712" text-anchor="middle" class="lbl" font-size="17" fill="#5B6B6E">문서 초안</text>
  <text x="380" y="736" text-anchor="middle" class="lbl" font-size="17" fill="#5B6B6E">작성</text>

  <!-- step 3 -->
  <rect x="520" y="420" width="160" height="260" rx="12" fill="#2F6E77" opacity="0.82"/>
  <circle cx="600" cy="386" r="26" fill="#2F6E77"/>
  <text x="600" y="394" text-anchor="middle" class="lbl" font-size="22" font-weight="700" fill="#F5F3EE">3</text>
  <text x="600" y="350" text-anchor="middle" class="lbl" font-size="19" font-weight="700" fill="#24424B">플래닝형</text>
  <text x="600" y="712" text-anchor="middle" class="lbl" font-size="17" fill="#5B6B6E">계획 수립 후</text>
  <text x="600" y="736" text-anchor="middle" class="lbl" font-size="17" fill="#5B6B6E">그대로 실행</text>

  <!-- step 4 -->
  <rect x="740" y="340" width="160" height="340" rx="12" fill="#2F6E77" opacity="0.95"/>
  <circle cx="820" cy="306" r="26" fill="#2F6E77"/>
  <text x="820" y="314" text-anchor="middle" class="lbl" font-size="22" font-weight="700" fill="#F5F3EE">4</text>
  <text x="820" y="270" text-anchor="middle" class="lbl" font-size="19" font-weight="700" fill="#24424B">자동작동형</text>
  <text x="820" y="712" text-anchor="middle" class="lbl" font-size="17" fill="#5B6B6E">계획 기반</text>
  <text x="820" y="736" text-anchor="middle" class="lbl" font-size="17" fill="#5B6B6E">자동 작동</text>

  <!-- step 5 -->
  <rect x="960" y="260" width="160" height="420" rx="12" fill="#D98A3D"/>
  <circle cx="1040" cy="226" r="26" fill="#D98A3D"/>
  <text x="1040" y="234" text-anchor="middle" class="lbl" font-size="22" font-weight="700" fill="#F5F3EE">5</text>
  <text x="1040" y="190" text-anchor="middle" class="lbl" font-size="19" font-weight="700" fill="#24424B">자율운영형</text>
  <text x="1040" y="712" text-anchor="middle" class="lbl" font-size="17" fill="#5B6B6E">상황 인지 후</text>
  <text x="1040" y="736" text-anchor="middle" class="lbl" font-size="17" fill="#5B6B6E">자율 운영</text>
</svg>
