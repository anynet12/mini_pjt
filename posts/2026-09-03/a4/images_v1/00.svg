<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <style>
      .lbl { font-family: system-ui, -apple-system, 'Malgun Gothic', sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#F5F3EE"/>

  <!-- decorative faint circle -->
  <circle cx="1500" cy="90" r="140" fill="#2F6E77" opacity="0.06"/>
  <circle cx="120" cy="820" r="100" fill="#D98A3D" opacity="0.07"/>

  <!-- kicker pill -->
  <rect x="100" y="72" width="440" height="56" rx="28" fill="#24424B"/>
  <text x="320" y="108" text-anchor="middle" class="lbl" font-size="26" font-weight="700" fill="#F5F3EE">AI 에이전트 레벨업 전략</text>

  <!-- title -->
  <text x="98" y="242" class="lbl" font-size="74" font-weight="700" fill="#24424B">처음부터 완벽하게 만들면</text>
  <text x="98" y="332" class="lbl" font-size="74" font-weight="700" fill="#D98A3D">안 되는 이유</text>

  <!-- subtitle -->
  <text x="100" y="398" class="lbl" font-size="30" fill="#5B6B6E">레벨 1 답변형부터 레벨 5 자율운영형까지, 계단식으로 키우는 법</text>

  <!-- staircase group -->
  <!-- ascending dashed arrow -->
  <path d="M 130 760 L 1380 470" stroke="#D98A3D" stroke-width="4" stroke-dasharray="10 10" fill="none"/>
  <path d="M 1380 470 L 1352 462 L 1372 494 Z" fill="#D98A3D"/>

  <!-- step 1 -->
  <rect x="100" y="750" width="180" height="70" rx="12" fill="#2F6E77" opacity="0.55"/>
  <circle cx="190" cy="716" r="24" fill="#2F6E77"/>
  <text x="190" y="724" text-anchor="middle" class="lbl" font-size="24" font-weight="700" fill="#F5F3EE">1</text>
  <text x="190" y="676" text-anchor="middle" class="lbl" font-size="22" font-weight="700" fill="#24424B">답변형</text>

  <!-- step 2 -->
  <rect x="405" y="670" width="180" height="150" rx="12" fill="#2F6E77" opacity="0.68"/>
  <circle cx="495" cy="636" r="24" fill="#2F6E77"/>
  <text x="495" y="644" text-anchor="middle" class="lbl" font-size="24" font-weight="700" fill="#F5F3EE">2</text>
  <text x="495" y="596" text-anchor="middle" class="lbl" font-size="22" font-weight="700" fill="#24424B">문서초안형</text>

  <!-- step 3 -->
  <rect x="710" y="590" width="180" height="230" rx="12" fill="#2F6E77" opacity="0.82"/>
  <circle cx="800" cy="556" r="24" fill="#2F6E77"/>
  <text x="800" y="564" text-anchor="middle" class="lbl" font-size="24" font-weight="700" fill="#F5F3EE">3</text>
  <text x="800" y="516" text-anchor="middle" class="lbl" font-size="22" font-weight="700" fill="#24424B">플래닝형</text>

  <!-- step 4 -->
  <rect x="1015" y="510" width="180" height="310" rx="12" fill="#2F6E77" opacity="0.95"/>
  <circle cx="1105" cy="476" r="24" fill="#2F6E77"/>
  <text x="1105" y="484" text-anchor="middle" class="lbl" font-size="24" font-weight="700" fill="#F5F3EE">4</text>
  <text x="1105" y="436" text-anchor="middle" class="lbl" font-size="22" font-weight="700" fill="#24424B">자동작동형</text>

  <!-- step 5 -->
  <rect x="1320" y="430" width="180" height="390" rx="12" fill="#D98A3D"/>
  <circle cx="1410" cy="396" r="24" fill="#D98A3D"/>
  <text x="1410" y="404" text-anchor="middle" class="lbl" font-size="24" font-weight="700" fill="#F5F3EE">5</text>
  <text x="1410" y="356" text-anchor="middle" class="lbl" font-size="22" font-weight="700" fill="#24424B">자율운영형</text>
</svg>
